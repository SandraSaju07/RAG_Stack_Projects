[project]
name = "star-wars-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sandra", email = "sandrasaju07@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "langchain>=0.3.30",
    "langchain-groq>=0.3.8",
    "langchain-huggingface>=0.3.1",
    "langchain-qdrant>=0.2.1",
    "langchain-text-splitters>=0.3.11",
    "qdrant-client>=1.16.1",
    "sentence-transformers>=5.1.2",
]

[project.scripts]
star-wars-rag = "star_wars_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
